<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Lead · Vendiamolatuaauto</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #f7f7f5;
    --text: #37352f;
    --text-muted: #787774;
    --text-faint: #9b9a97;
    --border: #e9e9e7;
    --border-strong: #dcdcda;
    --accent: #2383e2;
    --danger: #d9453f;
    --radius: 4px;
  }

  * { box-sizing: border-box; }

  /* Le regole con classe hanno più specificità dell'attributo `hidden` dello
     user-agent stylesheet: senza questa riga un elemento con `display` esplicito
     (es. .login-screen) resterebbe visibile anche da nascosto. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }

  /* ---------- Login ---------- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 340px;
  }
  .login-card h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .login-card p.sub {
    color: var(--text-muted);
    margin: 0 0 24px;
    font-size: 13px;
  }
  .field-label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .input {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  .input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(35, 131, 226, .18);
  }
  .stack > * + * { margin-top: 14px; }

  /* Riga sotto al pulsante di accesso, per il recupero password. */
  .login-aside {
    margin: 14px 0 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
  }
  .login-aside .link-btn { font-size: 13px; }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 12px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg);
    color: var(--text);
    font-weight: 500;
    transition: background .12s, border-color .12s, opacity .12s;
  }
  .btn:hover:not(:disabled) { background: var(--bg-subtle); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: #1a72c9; border-color: #1a72c9; }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn-block { width: 100%; }

  .alert {
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: 13px;
    background: #fdf0ef;
    color: var(--danger);
    border: 1px solid #f5d5d3;
  }
  .alert-ok {
    background: #f2f9f3;
    color: #2c6e35;
    border-color: #cfe3d4;
  }
  .alert-info {
    background: var(--bg-subtle);
    color: var(--text);
    border-color: var(--border-strong);
  }

  /* ---------- Layout app ---------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
  }
  .topbar h1 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .link-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--text-muted);
    text-decoration: underline;
    font-size: 13px;
  }
  .link-btn:hover { color: var(--text); }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    flex-wrap: wrap;
  }
  .toolbar .input { width: 280px; }
  .toolbar select.input { width: auto; padding-right: 28px; }
  .toolbar .count {
    margin-left: auto;
    color: var(--text-faint);
    font-size: 13px;
  }

  .stats-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    padding: 10px 24px 14px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .stats-bar b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .stats-bar .sep { color: var(--border-strong); }

  /* ---------- Tabella ---------- */
  .table-wrap { padding: 0 24px 64px; overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 860px;
  }
  th {
    text-align: left;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    padding: 8px 12px;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tbody tr:hover { background: var(--bg-subtle); }
  tbody tr.is-open { background: #f0f6fc; }
  .cell-primary { font-weight: 500; }
  .cell-sub {
    display: block;
    color: var(--text-faint);
    font-size: 12px;
  }
  .cell-muted { color: var(--text-muted); white-space: nowrap; }
  .cell-empty { color: var(--text-faint); }
  .num { font-variant-numeric: tabular-nums; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-cold      { background: #e7f0f8; color: #38618c; }
  .badge-warm      { background: #faecdd; color: #9a6316; }
  .badge-hot       { background: #fbe4e4; color: #b3261e; }
  .badge-assigned  { background: #eee0f7; color: #6c4396; }
  .badge-purchased { background: #dbeddb; color: #2c6e35; }
  .badge-lost      { background: #ebeced; color: #5f6368; }

  .state-msg {
    padding: 40px 12px;
    text-align: center;
    color: var(--text-faint);
  }

  /* ---------- Drawer ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 15, 15, .28);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
    z-index: 40;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .drawer {
    position: fixed;
    top: 0;
    right: 0;
    height: 100vh;
    width: min(620px, 100vw);
    background: var(--bg);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 24px rgba(15, 15, 15, .08);
    transform: translateX(100%);
    transition: transform .22s cubic-bezier(.32, .72, 0, 1);
    z-index: 50;
    display: flex;
    flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 24px 12px;
    border-bottom: 1px solid var(--border);
  }
  .drawer-title {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .drawer-subtitle { color: var(--text-muted); font-size: 13px; }
  .icon-btn {
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 20px;
    line-height: 1;
    padding: 4px 8px;
    border-radius: var(--radius);
  }
  .icon-btn:hover { background: var(--bg-subtle); color: var(--text); }

  .drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px 48px; }

  .section + .section { margin-top: 28px; }
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-faint);
    margin: 0 0 10px;
  }

  .prop {
    display: grid;
    grid-template-columns: 190px 1fr;
    gap: 12px;
    padding: 5px 0;
    align-items: baseline;
  }
  .prop-key { color: var(--text-muted); font-size: 13px; }
  .prop-val { font-size: 14px; word-break: break-word; }
  .prop-val a { color: var(--accent); text-decoration: none; }
  .prop-val a:hover { text-decoration: underline; }
  .prop-val.empty { color: var(--text-faint); }

  .valuation-box {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    background: var(--bg-subtle);
  }
  .euro-wrap { position: relative; display: block; }
  .euro-wrap .euro-sign {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
  }
  .euro-wrap .input { padding-left: 24px; font-variant-numeric: tabular-nums; }
  textarea.input { resize: vertical; min-height: 64px; }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 8px; }

  .consent-box {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid #cfe3d4;
    border-left: 3px solid #2c6e35;
    border-radius: var(--radius);
    background: #f2f9f3;
  }
  .consent-box strong { color: #2c6e35; }

  .email-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
  }
  .email-card + .email-card { margin-top: 10px; }
  .email-card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .email-subject { font-weight: 500; }
  .email-steps { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .step {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--bg-subtle);
    color: var(--text-faint);
    white-space: nowrap;
  }
  .step.done  { background: #dbeddb; color: #2c6e35; }
  .step.warn  { background: #fbe4e4; color: #b3261e; }
  .email-detail {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 8px;
    font-size: 13px;
    padding: 2px 0;
  }
  .email-detail span:first-child { color: var(--text-muted); }
  .email-note { font-size: 12px; color: var(--text-faint); margin: 10px 0 0; }
  .consent-box div { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

  /* ---------- Timeline ---------- */
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li {
    position: relative;
    padding: 0 0 16px 20px;
    border-left: 1px solid var(--border-strong);
  }
  .timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .timeline li::before {
    content: '';
    position: absolute;
    left: -4px;
    top: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--border-strong);
  }
  .timeline li.is-latest::before { background: var(--accent); }
  .timeline-time {
    font-size: 12px;
    color: var(--text-faint);
    font-variant-numeric: tabular-nums;
  }
  .timeline-title { font-size: 14px; }
  .timeline-desc { font-size: 13px; color: var(--text-muted); }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translate(-50%, 12px);
    background: #2f2f2c;
    color: #fff;
    padding: 9px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s, transform .16s;
    z-index: 60;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen" hidden>
  <form class="login-card stack" id="loginForm">
    <div>
      <h1>Dashboard lead</h1>
      <p class="sub">Accesso riservato · Vendiamolatuaauto</p>
    </div>
    <div class="alert" id="loginError" hidden></div>
    <div>
      <label class="field-label" for="loginEmail">Email</label>
      <input class="input" type="email" id="loginEmail" autocomplete="username" required>
    </div>
    <div>
      <label class="field-label" for="loginPassword">Password</label>
      <input class="input" type="password" id="loginPassword" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="loginSubmit">Accedi</button>
    <p class="login-aside">
      <button class="link-btn" type="button" id="forgotLink">Password dimenticata?</button>
    </p>
  </form>

  <!-- Richiesta del link di reimpostazione -->
  <form class="login-card stack" id="recoverForm" hidden>
    <div>
      <h1>Reimposta la password</h1>
      <p class="sub">Ti inviamo un link per scegliere una nuova password.</p>
    </div>
    <div class="alert" id="recoverMessage" hidden></div>
    <div>
      <label class="field-label" for="recoverEmail">Email</label>
      <input class="input" type="email" id="recoverEmail" autocomplete="username" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="recoverSubmit">Invia il link</button>
    <p class="login-aside">
      <button class="link-btn" type="button" id="backToLogin">Torna all'accesso</button>
    </p>
  </form>

  <!-- Scelta della nuova password, aperta dal link ricevuto via email -->
  <form class="login-card stack" id="resetForm" hidden>
    <div>
      <h1>Nuova password</h1>
      <p class="sub">Scegli una password di almeno 8 caratteri.</p>
    </div>
    <div class="alert" id="resetError" hidden></div>
    <div>
      <label class="field-label" for="newPassword">Nuova password</label>
      <input class="input" type="password" id="newPassword" autocomplete="new-password" minlength="8" required>
    </div>
    <div>
      <label class="field-label" for="confirmPassword">Conferma password</label>
      <input class="input" type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit" id="resetSubmit">Salva la password</button>
  </form>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="topbar">
    <h1>Lead</h1>
    <div class="topbar-right">
      <span id="currentUser"></span>
      <button class="link-btn" type="button" id="logoutBtn">Esci</button>
    </div>
  </div>

  <div class="toolbar">
    <input class="input" type="search" id="searchInput"
           placeholder="Cerca nome, email, telefono, targa, modello…" autocomplete="off">
    <select class="input" id="statusFilter">
      <option value="">Tutti gli stati</option>
      <option value="cold">Cold</option>
      <option value="warm">Warm</option>
      <option value="hot">Hot</option>
      <option value="assigned">Assegnata</option>
      <option value="purchased">Acquistata</option>
      <option value="lost">Persa</option>
    </select>
    <button class="btn" type="button" id="refreshBtn">Aggiorna</button>
    <span class="count" id="leadCount"></span>
  </div>

  <div class="stats-bar" id="statsBar" hidden></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width: 24%">Lead</th>
          <th style="width: 26%">Auto</th>
          <th style="width: 10%">Stato</th>
          <th style="width: 14%">Stima</th>
          <th style="width: 16%">Arrivata il</th>
          <th style="width: 10%"></th>
        </tr>
      </thead>
      <tbody id="leadRows"></tbody>
    </table>
    <div class="state-msg" id="tableState">Caricamento…</div>
  </div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Dettaglio lead">
  <div class="drawer-head">
    <div>
      <h2 class="drawer-title" id="drawerTitle">—</h2>
      <div class="drawer-subtitle" id="drawerSubtitle"></div>
    </div>
    <button class="icon-btn" type="button" id="drawerClose" aria-label="Chiudi">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script type="module">
"use strict";

/* =========================================================================
   Client Supabase Auth minimale.
   Login e refresh passano dalla chiave pubblica; tutti i dati delle lead
   arrivano invece dalle route /api/admin/*, che verificano il token lato
   server prima di toccare il database.
   ========================================================================= */

const SESSION_KEY = 'vlta_admin_session';
let config = null;

async function loadConfig() {
  if (config) return config;
  const res = await fetch('/api/admin/config');
  if (!res.ok) throw new Error('Configurazione del server non disponibile');
  config = await res.json();
  return config;
}

function readSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function writeSession(session) {
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(session)); } catch {}
}

function clearSession() {
  try { localStorage.removeItem(SESSION_KEY); } catch {}
}

async function authRequest(path, body) {
  const { supabaseUrl, anonKey } = await loadConfig();
  const res = await fetch(`${supabaseUrl}/auth/v1/${path}`, {
    method: 'POST',
    headers: { apikey: anonKey, 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(data.error_description || data.msg || data.error || 'Accesso non riuscito');
  }
  return data;
}

async function signIn(email, password) {
  const data = await authRequest('token?grant_type=password', { email, password });
  writeSession({
    access_token: data.access_token,
    refresh_token: data.refresh_token,
    email: data.user?.email || email,
  });
  return data;
}

/**
 * Chiede a Supabase l'email con il link di reimpostazione.
 *
 * `redirect_to` deve essere fra i Redirect URLs consentiti nelle impostazioni
 * di Supabase Auth, altrimenti il link rimanda al Site URL predefinito.
 */
async function requestPasswordRecovery(email) {
  const { supabaseUrl, anonKey, siteUrl } = await loadConfig();
  const base = (siteUrl || window.location.origin).replace(/\/+$/, '');
  const redirectTo = encodeURIComponent(`${base}/admin`);

  const res = await fetch(`${supabaseUrl}/auth/v1/recover?redirect_to=${redirectTo}`, {
    method: 'POST',
    headers: { apikey: anonKey, 'Content-Type': 'application/json' },
    body: JSON.stringify({ email }),
  });

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    const error = new Error(data.error_description || data.msg || data.error || 'Richiesta non riuscita');
    error.status = res.status;
    throw error;
  }
}

/**
 * Imposta la nuova password usando il token arrivato nel link dell'email.
 * Quel token vale come sessione, ma non viene salvato: dopo il cambio
 * l'operatore rientra dal form di accesso.
 */
async function updatePassword(accessToken, password) {
  const { supabaseUrl, anonKey } = await loadConfig();
  const res = await fetch(`${supabaseUrl}/auth/v1/user`, {
    method: 'PUT',
    headers: {
      apikey: anonKey,
      Authorization: `Bearer ${accessToken}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ password }),
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const error = new Error(data.error_description || data.msg || data.error || 'Salvataggio non riuscito');
    error.status = res.status;
    throw error;
  }
  return data;
}

async function refreshSession() {
  const session = readSession();
  if (!session?.refresh_token) return null;
  try {
    const data = await authRequest('token?grant_type=refresh_token', {
      refresh_token: session.refresh_token,
    });
    const next = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      email: data.user?.email || session.email,
    };
    writeSession(next);
    return next;
  } catch {
    clearSession();
    return null;
  }
}

/** Chiamata autenticata alle route admin, con un solo retry dopo il refresh. */
async function apiFetch(path, options = {}, isRetry = false) {
  const session = readSession();
  if (!session?.access_token) throw new Error('SESSION_EXPIRED');

  const res = await fetch(path, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: `Bearer ${session.access_token}`,
      ...(options.body ? { 'Content-Type': 'application/json' } : {}),
    },
  });

  if (res.status === 401 && !isRetry) {
    const refreshed = await refreshSession();
    if (refreshed) return apiFetch(path, options, true);
    throw new Error('SESSION_EXPIRED');
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Richiesta non riuscita');
  return data;
}

/* =========================================================================
   Formattazione
   ========================================================================= */

const STATUS_LABELS = {
  cold: 'Cold', warm: 'Warm', hot: 'Hot',
  assigned: 'Assegnata', purchased: 'Acquistata', lost: 'Persa',
};

const euroFmt = new Intl.NumberFormat('it-IT', {
  style: 'currency', currency: 'EUR', maximumFractionDigits: 0,
});
const dateFmt = new Intl.DateTimeFormat('it-IT', {
  day: '2-digit', month: '2-digit', year: 'numeric',
});
const dateTimeFmt = new Intl.DateTimeFormat('it-IT', {
  day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit',
});
const fullDateTimeFmt = new Intl.DateTimeFormat('it-IT', {
  day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit',
});

const money = (v) => (v === null || v === undefined || v === '' ? null : euroFmt.format(Number(v)));
const asDate = (v) => (v ? dateFmt.format(new Date(v)) : null);
const asDateTime = (v) => (v ? fullDateTimeFmt.format(new Date(v)) : null);

const RECOVERY_SENT = "Se l'indirizzo è associato a un account, riceverai a breve "
  + "un'email con il link per reimpostare la password. Controlla anche lo spam.";

document.getElementById('forgotLink').addEventListener('click', () => showRecover());

recoverForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('recoverEmail').value.trim();
  if (!email) return;

  recoverSubmit.disabled = true;
  recoverSubmit.textContent = 'Invio…';
  try {
    await requestPasswordRecovery(email);
    showRecover(RECOVERY_SENT, 'ok');
  } catch (error) {
    // Un limite di frequenza va detto, altrimenti l'operatore riprova a vuoto.
    if (error.status === 429 || /rate|limit|secondi|seconds/i.test(error.message)) {
      showRecover('Troppe richieste ravvicinate. Attendi qualche minuto e riprova.', 'error');
    } else {
      // Per ogni altro esito rispondiamo come se fosse andata a buon fine:
      // distinguere i casi rivelerebbe quali indirizzi sono registrati.
      showRecover(RECOVERY_SENT, 'ok');
    }
  } finally {
    recoverSubmit.disabled = false;
    recoverSubmit.textContent = 'Invia il link';
  }
});

resetForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;

  const fail = (message) => {
    resetError.className = 'alert';
    resetError.textContent = message;
    resetError.hidden = false;
  };

  if (password.length < 8) return fail('La password deve avere almeno 8 caratteri.');
  if (password !== confirm) return fail('Le due password non coincidono.');
  if (!recoveryToken) {
    return showRecover('Il link non è più valido. Richiedine uno nuovo.', 'error');
  }

  resetError.hidden = true;
  resetSubmit.disabled = true;
  resetSubmit.textContent = 'Salvataggio…';
  try {
    await updatePassword(recoveryToken, password);
    recoveryToken = null;
    clearRecoveryHash();
    resetForm.reset();
    showLogin('Password aggiornata. Accedi con le nuove credenziali.', 'ok');
  } catch (error) {
    if (error.status === 401 || error.status === 403) {
      recoveryToken = null;
      clearRecoveryHash();
      showRecover('Il link è scaduto o è già stato usato. Richiedine uno nuovo.', 'error');
    } else if (/different from the old password/i.test(error.message)) {
      fail('La nuova password deve essere diversa da quella precedente.');
    } else if (/at least|should be/i.test(error.message)) {
      fail('La password non rispetta i requisiti minimi richiesti.');
    } else {
      fail(error.message);
    }
  } finally {
    resetSubmit.disabled = false;
    resetSubmit.textContent = 'Salva la password';
  }
});

/** Toglie il token dalla barra degli indirizzi senza ricaricare la pagina. */
function clearRecoveryHash() {
  try {
    window.history.replaceState(null, '', window.location.pathname + window.location.search);
  } catch {
    window.location.hash = '';
  }
}

/**
 * Legge il frammento dell'URL su cui atterra il link dell'email.
 * Supabase vi mette access_token e type=recovery, oppure error/error_description
 * quando il link è scaduto o già usato.
 *
 * @returns {'reset'|'error'|null} cosa è stato trovato
 */
function consumeRecoveryHash() {
  const raw = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : '';
  if (!raw) return null;

  let params;
  try { params = new URLSearchParams(raw); } catch { return null; }

  const error = params.get('error') || params.get('error_code');
  if (error) {
    const description = params.get('error_description') || '';
    clearRecoveryHash();
    const scaduto = /expired|invalid/i.test(error + ' ' + description);
    showRecover(
      scaduto
        ? 'Il link è scaduto o non è più valido. Richiedine uno nuovo qui sotto.'
        : 'Non è stato possibile aprire il link. Richiedine uno nuovo qui sotto.',
      'error',
    );
    return 'error';
  }

  if (params.get('type') === 'recovery' && params.get('access_token')) {
    recoveryToken = params.get('access_token');
    clearRecoveryHash();
    showAuthView('reset');
    resetError.hidden = true;
    return 'reset';
  }

  return null;
}

    const contact = document.createElement('span');

function renderStats(stats) {
  const bar = document.getElementById('statsBar');
  if (!stats || !stats.inviate) { bar.hidden = true; return; }

  bar.textContent = '';
  const voci = [
    ['Email inviate', stats.inviate],

    ['Aperte', stats.aperte],
    ['Cliccate', stats.cliccate],
    ['CTA accettate', stats.ctaAccettate],
  ];

  voci.forEach(([label, value], i) => {
    if (i) {
      const sep = document.createElement('span');
      sep.className = 'sep';
      sep.textContent = '·';
      bar.appendChild(sep);
    }
    const item = document.createElement('span');
    item.textContent = label + ' ';
    const strong = document.createElement('b');
    strong.textContent = String(value ?? 0);
    item.appendChild(strong);
    bar.appendChild(item);
  });

  bar.title = 'Le aperture sono un dato indicativo: alcuni client di posta caricano '
            + 'le immagini da soli, altri le bloccano.';
  bar.hidden = false;
}

async function loadLeads() {
  const params = new URLSearchParams();
  const q = searchInput.value.trim();
  if (q) params.set('q', q);
  if (statusFilter.value) params.set('status', statusFilter.value);

  const token = ++loadToken;
  try {
    setTableState(leads.length ? '' : 'Caricamento…');
    const data = await apiFetch(`/api/admin/leads?${params.toString()}`);
    if (token !== loadToken) return; // una richiesta più recente ha già risposto
    leads = data.leads || [];
    renderTable();
    renderStats(data.stats);
  } catch (error) {
    if (token !== loadToken) return;
    if (error.message === 'SESSION_EXPIRED') return showLogin('Sessione scaduta, accedi di nuovo.');
    setTableState(error.message);
  }
}

function propRow(key, value, options = {}) {
  const row = document.createElement('div');
  row.className = 'prop';

  const k = document.createElement('div');
  k.className = 'prop-key';
  k.textContent = key;

  const v = document.createElement('div');
  v.className = 'prop-val';

  if (value === null || value === undefined || value === '') {
    v.classList.add('empty');
    v.textContent = '—';
  } else if (options.href) {
    const a = document.createElement('a');
    a.href = options.href;
    a.textContent = value;
    v.appendChild(a);
  } else {
    v.textContent = value;
  }

  row.append(k, v);
  return row;
}

function section(title) {
  const wrap = document.createElement('div');
  wrap.className = 'section';
  const h = document.createElement('h3');
  h.className = 'section-title';
  h.textContent = title;
  wrap.appendChild(h);
  return wrap;
}

/** Stato di consegna delle email inviate alla lead. */
function renderEmailSection(messages) {
  if (!messages || !messages.length) return null;

  const s = section('Email');

  for (const m of messages) {
    const card = document.createElement('div');
    card.className = 'email-card';

    const head = document.createElement('div');
    head.className = 'email-card-head';
    const subject = document.createElement('span');
    subject.className = 'email-subject';
    subject.textContent = m.subject || 'Email';
    const when = document.createElement('span');
    when.className = 'cell-muted';
    when.style.fontSize = '12px';
    when.textContent = asDate(m.sent_at || m.created_at) || '';
    head.append(subject, when);
    card.appendChild(head);

    // Avanzamento: verde per le tappe raggiunte, rosso per bounce e reclami.
    const steps = document.createElement('div');
    steps.className = 'email-steps';
    const tappe = [
      ['Inviata', !!m.sent_at, false],
      ['Consegnata', !!m.delivered_at, false],
      ['Aperta', !!m.opened_at, false],
      ['Cliccata', !!m.clicked_at, false],
    ];
    if (m.bounced_at) tappe.push(['Bounce', true, true]);
    if (m.complained_at) tappe.push(['Segnalata come spam', true, true]);

    for (const [label, done, warn] of tappe) {
      const el = document.createElement('span');
      el.className = 'step' + (done ? (warn ? ' warn' : ' done') : '');
      el.textContent = label;
      steps.appendChild(el);
    }
    card.appendChild(steps);

    const righe = [
      ['Inviata il', asDateTime(m.sent_at)],
      ['Consegnata il', asDateTime(m.delivered_at)],
      ['Prima apertura', asDateTime(m.opened_at)],
      ['Ultima apertura', m.open_count > 1 ? asDateTime(m.last_opened_at) : null],
      ['Aperture', m.open_count ? String(m.open_count) : null],
      ['Primo click', asDateTime(m.clicked_at)],
      ['Click', m.click_count ? String(m.click_count) : null],
      ['Bounce', asDateTime(m.bounced_at)],
      ['Segnalata come spam', asDateTime(m.complained_at)],
    ].filter(([, value]) => value);

    for (const [label, value] of righe) {
      const row = document.createElement('div');
      row.className = 'email-detail';
      const k = document.createElement('span');
      k.textContent = label;
      const v = document.createElement('span');
      v.textContent = value;
      row.append(k, v);
      card.appendChild(row);
    }

    if (m.opened_at) {
      const note = document.createElement('p');
      note.className = 'email-note';
      note.textContent = "Le aperture sono un dato indicativo: alcuni client di posta caricano "
        + "le immagini da soli, altri le bloccano. Vale come consenso solo il click sulla CTA.";
      card.appendChild(note);
    }

    s.appendChild(card);
  }

  return s;
}

function renderTimelineSection(events) {
  const s = section('Storico');

  if (!events || !events.length) {
    const empty = document.createElement('p');
    empty.className = 'prop-val empty';
    empty.textContent = 'Nessun evento registrato.';
    s.appendChild(empty);
    return s;
  }

  const list = document.createElement('ul');
  list.className = 'timeline';

  events.forEach((event, index) => {
    const li = document.createElement('li');
    if (index === events.length - 1) li.classList.add('is-latest');

    const time = document.createElement('div');
    time.className = 'timeline-time';
    time.textContent = dateTimeFmt.format(new Date(event.created_at));

    const title = document.createElement('div');
    title.className = 'timeline-title';
    title.textContent = event.title;

    li.append(time, title);

    if (event.description) {
      const desc = document.createElement('div');
      desc.className = 'timeline-desc';
      desc.textContent = event.description;
      li.appendChild(desc);
    }

    list.appendChild(li);
  });

  s.appendChild(list);
  return s;
}

/** Mostra qualunque colonna valorizzata non già presente nelle sezioni sopra. */
function renderOtherSection(lead) {
  const extras = Object.entries(lead).filter(([key, value]) =>
    !HANDLED_COLUMNS.has(key) && value !== null && value !== undefined && value !== '');

  if (!extras.length) return null;

  const s = section('Altri dati');
  for (const [key, value] of extras) {
    const label = COLUMN_LABELS[key] || key.replace(/_/g, ' ');
    let display = value;
    if (typeof value === 'boolean') display = value ? 'Sì' : 'No';
    else if (typeof value === 'object') display = JSON.stringify(value);
    else if (/_at$/.test(key)) display = asDateTime(value);
    else if (/price|amount|margin/.test(key)) display = money(value);
    s.appendChild(propRow(label, display));
  }
  return s;
}

function renderDrawer(lead, events, messages) {
  drawerTitle.textContent = fullName(lead);
  const parts = [vehicleLabel(lead), lead.vehicle_km !== null ? `${new Intl.NumberFormat('it-IT').format(lead.vehicle_km)} km` : null];
  drawerSubtitle.textContent = parts.filter(Boolean).join(' · ');

  drawerBody.textContent = '';
  drawerBody.append(
    renderValuationSection(lead),
    renderContactSection(lead),
    renderVehicleSection(lead),
  );
  const emails = renderEmailSection(messages);
  if (emails) drawerBody.appendChild(emails);
  drawerBody.appendChild(renderTimelineSection(events));
  const other = renderOtherSection(lead);
  if (other) drawerBody.appendChild(other);
  drawerBody.scrollTop = 0;
}

async function openDrawer(id) {
  openLeadId = id;
  renderTable();
  overlay.classList.add('open');
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');

  drawerTitle.textContent = 'Caricamento…';
  drawerSubtitle.textContent = '';
  drawerBody.textContent = '';

  try {
    const data = await apiFetch(`/api/admin/lead?id=${encodeURIComponent(id)}`);
    renderDrawer(data.lead, data.events, data.messages);
  } catch (error) {
    if (error.message === 'SESSION_EXPIRED') return showLogin('Sessione scaduta, accedi di nuovo.');
    drawerTitle.textContent = 'Errore';
    drawerBody.textContent = error.message;
  }
}

function closeDrawer() {
  overlay.classList.remove('open');
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
  openLeadId = null;
  renderTable();
}

overlay.addEventListener('click', closeDrawer);
document.getElementById('drawerClose').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
});

/* =========================================================================
   Avvio
   ========================================================================= */

async function startApp() {
  const session = readSession();
  if (!session?.access_token) return showLogin();
  showApp(session.email);
  await loadLeads();
}

(async function init() {
  try {
    await loadConfig();
  } catch (error) {
    showLogin(error.message);
    return;
  }
  // Il link di recupero ha la precedenza: va gestito anche se nel browser
  // è rimasta una sessione valida.
  if (consumeRecoveryHash()) return;
  await startApp();
})();

// Se /admin è già aperto in questa scheda, aprire il link dell'email cambia
// solo il frammento e il browser non ricarica la pagina: senza questo ascolto
// il form della nuova password non comparirebbe.
window.addEventListener('hashchange', () => { consumeRecoveryHash(); });
</script>
